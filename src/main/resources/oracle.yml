# El Oraculo y Relicarios del Olimpo. Los comandos se ejecutan como consola; %player% se sustituye seguro al reclamar.
relicaries:
  hercules:
    name: "Lesser Relicary of Hercules"
    key-name: "Herculean Essence"
    material: IRON_AXE
    rewards:
      dragmas: { name: "Bag of Dragmas", rarity: COMMON, weight: 70, material: GOLD_NUGGET, commands: ["eco give %player% 250"] }
      protector: { name: "Hercules Protection", rarity: RARE, weight: 25, material: SHIELD, commands: ["give %player% shield 1"] }
      fuerza: { name: "Hero's Strength", rarity: LEGENDARY, weight: 5, material: DIAMOND_SWORD, commands: ["give %player% diamond_sword 1"] }
  hestia:
    name: "Sacred Relicary of Hestia"
    key-name: "Sacred Flame"
    material: CAMPFIRE
    rewards:
      recursos: { name: "Sacred Resources", rarity: COMMON, weight: 70, material: IRON_INGOT, commands: ["give %player% iron_ingot 16"] }
      cheque: { name: "Dragmas Cheque", rarity: RARE, weight: 25, material: GOLD_INGOT, commands: ["eco give %player% 1500"] }
      brasa: { name: "Eternal Ember", rarity: LEGENDARY, weight: 5, material: BLAZE_ROD, commands: ["give %player% blaze_rod 16"] }
  hermes:
    name: "Winged Relicary of Hermes"
    key-name: "Celestial Feather"
    material: FEATHER
    rewards:
      plumas: { name: "Celestial Feathers", rarity: COMMON, weight: 70, material: FEATHER, commands: ["give %player% feather 32"] }
      descuento: { name: "Hermes Coupon", rarity: RARE, weight: 25, material: EMERALD, commands: ["eco give %player% 1000"] }
      vuelo: { name: "Favor of Hermes", rarity: LEGENDARY, weight: 5, material: ELYTRA, commands: ["give %player% elytra 1"] }
  hefesto:
    name: "Hephaestus Forge Relicary"
    key-name: "Vulcan Ingot"
    material: ANVIL
    rewards:
      lingotes: { name: "Forge Ingots", rarity: COMMON, weight: 70, material: IRON_INGOT, commands: ["give %player% iron_ingot 32"] }
      diamantes: { name: "Forge Core", rarity: RARE, weight: 25, material: DIAMOND, commands: ["give %player% diamond 8"] }
      pico: { name: "Hephaestus Pickaxe", rarity: LEGENDARY, weight: 5, material: NETHERITE_PICKAXE, commands: ["give %player% netherite_pickaxe 1"] }
  titanes:
    name: "Supreme Relicary of the Titans"
    key-name: "Tear of Chaos"
    material: DRAGON_EGG
    rewards:
      caos: { name: "Chaos Fragment", rarity: COMMON, weight: 65, material: AMETHYST_SHARD, commands: ["give %player% amethyst_shard 16"] }
      aura: { name: "Titan Aura", rarity: EPIC, weight: 30, material: ECHO_SHARD, commands: ["give %player% echo_shard 8"] }
      corona: { name: "Crown of the Titans", rarity: DIVINE, weight: 5, material: NETHER_STAR, commands: ["give %player% nether_star 1"] }

# De donde salen las llaves (ademas de /oraculo givekey y la tienda).
key-sources:
  votes:
    enabled: true
    relicary: hercules
    keys: 1
  bosses:
    enabled: true
    # entidades cuyo nombre visible contiene alguna de estas palabras (jefes de DrakesBosses/MultiverseCreatures)
    name-contains: [jefe, boss, titan, "titán", hidra, minotauro, cerbero, kraken, dragon, "dragón", wither]
    chance: 1.0
    relicary: hefesto
    keys: 1
