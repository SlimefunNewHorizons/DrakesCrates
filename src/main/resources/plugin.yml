name: DrakesCrates
version: 2.0
main: me.jackstar.drakescrates.DrakesCratesPlugin
api-version: '1.20'
authors: [JackStar]
description: Virtual & Physical Crates system with Slimefun support and Classic (Vanilla) guard for DrakesCraft.
softdepend: [PlaceholderAPI, Votifier, VotifierPlus, Slimefun, Slimefun4, Slimefun4-Drake]
commands:
  crates:
    description: Opens the virtual crates menu and shows your keys
    usage: /crates [balance]
    aliases: [crate, c, cratesmenu]
  oraculo:
    description: Opens the Oracle and the Olympus Relicaries
    usage: /oraculo [givekey|takekey|setpity|reclamar|reload]
    aliases: [relicarios, oraculos]
  drakescrates:
    description: DrakesCrates administration command
    usage: /drakescrates <givekey|givevirtualkey|takekey|balance|editor|reload>
    permission: drakescrates.admin
    aliases: [dcrate, dcrates, drcrate, dc]
permissions:
  drakescrates.use:
    description: Lets the player open the virtual crates menu
    default: true
  drakescrates.admin:
    description: Access to DrakesCrates administrative commands
    default: op
